name: Build Lyric Float for iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build the iPhone app and Live Activity extension
        run: |
          set -e
          xcodebuild -project LyricFloat.xcodeproj -scheme LyricFloat -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          app="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/LyricFloat.app"
          test -f "$app/PlugIns/LyricFloatLiveActivity.appex/LyricFloatLiveActivity"
          test ! -d "$app/Watch"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$app" "$RUNNER_TEMP/package/Payload/LyricFloat.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/package/Payload" "$RUNNER_TEMP/LyricFloat.ipa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LyricFloat
          path: ${{ runner.temp }}/LyricFloat.ipa
          retention-days: 3
